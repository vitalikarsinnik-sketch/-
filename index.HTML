<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квіз - Перевір свій мозок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    
    <!-- Кнопка перемикання теми -->
    <button class="theme-toggle" id="theme-toggle" title="Змінити тему">🌓</button>
    
    <div id="start-screen" class="screen">
        <h1 class="name">Перевір свої знання про комп'ютер🖥️️</h1>
        <h2 class="subtitle">10 питань • різні теми • лише 1 правильна відповідь</h2>
        <p>Чи зможеш набрати 10/10?</p>
        
        <button class="start-button" id="start-btn">Почати гру</button>
    </div>
    
    <div id="quiz-screen" class="screen hide">
        <div class="header">
            <span class="question-label">📝 Питання</span>
            <span id="timer">Час: 15</span>
        </div>
        
        <h2 id="question-text">Запитання 1</h2>
        
        <div id="answers-container"></div>
    </div>
    
    <div id="result-screen" class="screen hide">
        <h2>🎉 Квіз завершено</h2>
        <p id="result-text"></p>
        <div class="score-container">
            <p>Правильних відповідей: <span id="final-score">0</span>/10</p>
        </div>
        <button id="restart-btn">🔄 Спробувати ще</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
